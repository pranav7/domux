name: ci

on:
  push:
    branches: [main, v2]
  pull_request:
    branches: [main, v2]

env:
  CARGO_TERM_COLOR: always
  ZIG_GLOBAL_CACHE_DIR: ${{ github.workspace }}/target/zig-global-cache

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest        # Apple silicon
            target: aarch64-apple-darwin
          - os: ubuntu-latest       # x86_64
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm    # aarch64
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    # A test that hangs rather than failing is not hypothetical here: a helper waiting on a
    # deadline that stops being checked never returns, and a test binary has no way to report
    # "this did not finish". Without this the job runs to GitHub's default of six hours.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1          # keep equal to rust-toolchain.toml
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Cache Zig and the pinned Ghostty source
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/domux/zig
            ~/.cache/domux/ghostty
            target/zig-global-cache
          key: ghostty-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('vendor/zig-pin.toml', 'vendor/ghostty-pin.toml') }}
      - run: cargo fmt --all --check
      - run: cargo build --workspace --locked
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # The agent suites, ahead of the workspace run and as a step of their own, because they
      # are the slow ones: the observer tests wait real seconds for the core's once-a-second
      # tick and the animation tests wait on a 70 ms ticker. A failure here names itself
      # instead of arriving inside a run of every suite. The workspace run below runs them
      # again and reuses the binaries this step built, so the repeat costs their run time and
      # not a rebuild. macOS and Linux both matter for these in particular: the process
      # inspector reads the foreground process and a process's working directory through
      # libproc on macOS and /proc on Linux, and the observer is that trait's largest user.
      - name: Agent tests
        run: >
          cargo test -p domux-server --locked
          --test agent_observer
          --test agent_report
          --test agent_api
          --test agent_install
          --test agents_overlay
          --test agents_sidebar
          --test agents_top_bar
          --test agents_animation
          --test navigator
        timeout-minutes: 10
      - run: cargo test --workspace --locked
        # Also bounded at the step, so a hang is reported as "the tests did not finish"
        # rather than as a job cancelled with no step named.
        timeout-minutes: 10

  cross-macos-x86_64:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
          targets: x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - name: Cache Zig and the pinned Ghostty source
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/domux/zig
            ~/.cache/domux/ghostty
            target/zig-global-cache
          key: ghostty-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('vendor/zig-pin.toml', 'vendor/ghostty-pin.toml') }}
      - run: cargo build --workspace --locked --target x86_64-apple-darwin

  # The shell half of the repository: the installer, the release scripts and the license files.
  # It runs on both platforms because the installer has to work under dash, bash and macOS's sh.
  shell:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: License files
        run: sh tests/license/run.sh
      - name: Release scripts
        run: sh tests/release/run.sh
      - name: Installer under sh
        run: sh tests/install/run.sh
      - name: Installer under bash
        run: TEST_SHELL=bash sh tests/install/run.sh
      - name: shellcheck
        if: runner.os == 'Linux'
        run: shellcheck -s sh install.sh scripts/release/*.sh tests/lib/assert.sh tests/license/run.sh tests/release/run.sh tests/install/run.sh tests/install/fakebin/*

  # Every crate compiled into a release binary carries a license the project accepts, and the
  # attribution file the archives ship can be generated.
  license:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1          # keep equal to rust-toolchain.toml
      - uses: Swatinem/rust-cache@v2
        with:
          cache-all-crates: true     # keeps the installed cargo-about in the cache
      - name: Install cargo-about
        run: cargo install cargo-about --version 0.9.2 --locked --features cli
      - name: Every compiled license is accepted
        run: cargo about generate --fail -o /dev/null about.hbs
