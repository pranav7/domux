[package]
name = "domux"
description = "domux: a terminal multiplexer for engineers who direct AI agents"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "domux"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
domux-core = { path = "../domux-core" }
domux-server = { path = "../domux-server" }
domux-client = { path = "../domux-client" }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = "1"
serde_json = "1"
chrono = "0.4"
tracing = "0.1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "net", "io-util", "time", "signal", "process"] }
libc = "0.2"

[dev-dependencies]
tempfile = "3"
portable-pty = "0.9"
