[package]
name = "m0-spike"
description = "M0 pane spike: one process, PTY panes, ratatui rendering. Lifted or deleted in M1."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "m0-spike"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
anyhow = "1.0.104"
crossterm = { version = "0.29.0", features = ["event-stream", "bracketed-paste"] }
domux-term = { path = "../domux-term", features = ["ghostty", "alacritty"] }
portable-pty = "0.9.0"
ratatui = { version = "0.30.2", features = ["underline-color"] }
tokio = { version = "1.53.1", features = ["rt", "macros", "sync", "signal", "time"] }
