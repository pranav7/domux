[package]
name = "domux-server"
description = "The domux server: core task, panes, rendering, socket, persistence"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
domux-core = { path = "../domux-core" }
domux-term = { path = "../domux-term" }
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1.3"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "sync", "net", "io-util", "time", "signal", "fs", "process"] }
portable-pty = "0.9"
ratatui = { version = "0.30", default-features = false, features = ["underline-color"] }
libc = "0.2"
chrono = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
unicode-segmentation = "1"
tempfile = "3"

[dev-dependencies]
tempfile = "3"
