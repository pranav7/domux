[package]
name = "domux-core"
description = "Pure model, layout, keymap, config, protocol and state types for domux"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
domux-term = { path = "../domux-term" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1.0"
toml = "0.8"
thiserror = "2"
bincode = "1.3"
unicode-width = "0.2"
unicode-segmentation = "1"
