[package]
name = "domux-term"
description = "Terminal emulator trait and implementations for domux"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
links = "ghostty-vt"
build = "build.rs"

[lints]
workspace = true

[features]
default = ["ghostty"]
ghostty = []
alacritty = ["dep:alacritty_terminal", "dep:termwiz"]

[dependencies]
alacritty_terminal = { version = "0.26.0", optional = true }
bitflags = "2.13.1"
compact_str = "0.10.0"
termwiz = { version = "0.23.3", optional = true, default-features = false }

[build-dependencies]
sha2 = "0.10"
toml = "0.9"

[dev-dependencies]
sha2 = "0.10"
toml = "0.9"
